# 各平台映射配置
# 类目映射、属性映射、图片规则

taobao:
  name: "淘宝/天猫"
  api_base: "https://eco.taobao.com/router/rest"
  image:
    max_count: 5
    min_size: [800, 800]
    format: ["jpg", "png"]
  required_fields:
    - title
    - price
    - main_images
    - category_id
  category_map:
    "服装": "50010404"
    "鞋靴": "50006843"
    "数码": "120208009"

douyin:
  name: "抖店"
  api_base: "https://openapi-fxg.jinritemai.com"
  image:
    max_count: 5
    min_size: [600, 600]
    format: ["jpg", "png", "jpeg"]
  required_fields:
    - title
    - price
    - main_images
    - category_id

pdd:
  name: "拼多多"
  api_base: "https://open-api.pinduoduo.com"
  image:
    max_count: 10
    min_size: [480, 480]
    format: ["jpg", "png"]

amazon:
  name: "亚马逊"
  api_base: "https://sellingpartnerapi-na.amazon.com"
  image:
    max_count: 9
    min_size: [1000, 1000]
    format: ["jpg", "png", "tiff"]
  required_fields:
    - title
    - price
    - main_images
    - category_id
    - brand
    - manufacturer
