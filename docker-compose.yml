version: "3.9"

services:
  backend:
    build: ./ecommerce_auto_publish
    container_name: ecom-backend
    restart: unless-stopped
    ports:
      - "8800:8800"
    volumes:
      - backend_data:/app/data
      - backend_config:/app/config
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8800/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ecom-net

  frontend:
    build: ./frontend
    container_name: ecom-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ecom-net

volumes:
  backend_data:
    driver: local
  backend_config:
    driver: local

networks:
  ecom-net:
    driver: bridge
